<title>Games/Tools</title>
<style>
* { box-sizing: border-box; }
body, html { margin: 0; min-height: 100%; font-family: Tahoma, sans-serif; background: #000; color: #00ff00; }
.content, .xp-content { min-height: 100vh; } .xp-content { font-family: 'Courier New', Courier, monospace; }
a { color: #00ff00; text-decoration: none; } a:hover { text-decoration: underline; }
.top-banner { background: #00aa00; color: #fff; text-align: center; padding: 10px; font-weight: bold; }
header { background: #001100; padding: 20px; text-align: center; font-size: 2em; letter-spacing: 2px; }
nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; background: #002200; padding: 10px; }
nav a { font-size: 1.1em; padding: 8px 12px; }
section { padding: 20px; max-width: 980px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
h1, h2 { text-shadow: 0 0 5px #00ff00; }
.game-button { width: 100%; min-height: 54px; padding: 12px 16px; border: 1px solid #00ff00; background: #002200; color: #00ff00; cursor: pointer; font: inherit; font-size: 1.05em; overflow-wrap: anywhere; }
.game-button:hover { background: #004400; }
.glitch { color: #00ff00; position: relative; display: inline-block; }
.glitch::before, .glitch::after { content: attr(data-text); position: absolute; left: 0; top: 0; opacity: .8; clip: rect(0, 900px, 0, 0); }
.glitch::before { animation: glitchTop 2s infinite linear alternate-reverse; color: #00ff99; }
.glitch::after { animation: glitchBottom 2s infinite linear alternate-reverse; color: #009900; }
footer { text-align: center; padding: 20px; background: #001100; font-size: .9em; }
@media (min-width: 768px) { nav { gap: 30px; padding: 10px 0; } nav a { padding: 0; } section { padding: 40px; gap: 20px; } }
@media (max-width: 480px) { header { font-size: 1.5em; padding: 16px 8px; letter-spacing: 1px; } section { grid-template-columns: 1fr; padding: 16px; } }
</style>
</head>

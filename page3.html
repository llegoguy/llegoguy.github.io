<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games/Tools</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Tahoma, sans-serif;
      background-color: #000000;
      color: #00ff00;
    }

    .content {
      flex: 1;
      padding: 0;
      background-color: #000000;
      overflow: visible;
      border: none;
      display: block;
      min-height: 100vh;
    }

    .xp-content {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background-color: #000;
      color: #00ff00;
      height: auto;
      min-height: 100vh;
    }

    .xp-content a {
      color: #00ff00;
      text-decoration: none;
    }

    .xp-content a:hover {
      text-decoration: underline;
    }

    .top-banner {
      background-color: #00aa00;
      color: #fff;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    header {
      background: #001100;
      padding: 20px;
      text-align: center;
      font-size: 2em;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      background: #002200;
      padding: 10px 0;
    }

    nav a {
      font-size: 1.1em;
    }

    section {
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }

    h1, h2 {
      text-shadow: 0 0 5px #00ff00;
    }

    .game-button {
      display: inline-block;
      margin: 20px;
      padding: 15px 25px;
      border: 1px solid #00ff00;
      background: #002200;
      color: #00ff00;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1em;
    }

    .game-button:hover {
      background: #004400;
    }

    .glitch {
      color: #00ff00;
      position: relative;
      display: inline-block;
    }

    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0.8;
      clip: rect(0, 900px, 0, 0);
    }

    .glitch::before {
      animation: glitchTop 2s infinite linear alternate-reverse;
      color: #00ff99;
    }

    .glitch::after {
      animation: glitchBottom 2s infinite linear alternate-reverse;
      color: #009900;
    }

    @keyframes glitchTop, glitchBottom {
      /* Your existing keyframes */
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #001100;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="xp-content">
      <div class="top-banner">⚡ Games/Tools ⚡</div>

      <header>
        <span class="glitch" data-text="GAMES/TOOLS">GAMES/TOOLS</span>
      </header>

      <nav>
        <a href="index.html">Home</a>
        <a href="page1.html">Blog</a>
        <a href="page2.html">Downloads</a>
        <a href="page3.html">Games/Tools</a>
      </nav>

      <section>
        <button class="game-button" onclick="window.open('games/clicker.html', '_blank')">Clicker game(BETA!!)</button>
        <button class="game-button" onclick="window.open('games/snake.html', '_blank')">Snake</button>
        <button class="game-button" onclick="window.open('games/3d-rubiks-cube.html', '_blank')">3D Rubiks cube (BETA!!!)</button>
        <button class="game-button" onclick="window.open('games/dodge-the-squares.html', '_blank')">Dodge the squares</button>
        <button class="game-button" onclick="window.open('tools/rng.html', '_blank')">Random number generator</button>
        <button class="game-button" onclick="window.open('tools/text-reverser.html', '_blank')">Text reverser</button>
        <button class="game-button" onclick="window.open('tools/calculator.html', '_blank')">Calculator</button>
      </section>

      <footer>
        &copy; Jakub 2026
      </footer>
    </div>
  </div>
</body>
</html>

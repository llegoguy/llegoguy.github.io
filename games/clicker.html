<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Clicker Game</title>
<style>
* { box-sizing: border-box; } body { background: black; color: #00ff00; font-family: system-ui, sans-serif; text-align: center; padding: clamp(16px, 6vw, 50px); margin: 0; min-height: 100vh; }
h1 { font-size: clamp(1.7rem, 7vw, 2.5rem); overflow-wrap: anywhere; }
button { font-size: clamp(18px, 5vw, 20px); padding: 12px 22px; min-height: 48px; margin-top: 20px; background: transparent; border: 2px solid #00ff00; color: #00ff00; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
button:hover { filter: brightness(1.2); }
</style></head><body>
<h1>Clicker Game</h1><p>Points: <span id="points">0</span></p><button id="clickBtn">Click me!</button>
<script>let points = 0; const pointsEl = document.getElementById('points'); document.getElementById('clickBtn').addEventListener('click', () => { points++; pointsEl.textContent = points; });</script>
</body></html>

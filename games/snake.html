<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snake Game</title>
<style>
* { box-sizing: border-box; } body { background: #000; color: #00ff00; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 12px; }
h1 { text-shadow: 0 0 5px #00ff00; margin: 12px 0; font-size: clamp(1.6rem, 6vw, 2.2rem); }
canvas { background: #000; display: block; width: min(400px, 100%); height: auto; aspect-ratio: 1; margin: 16px auto; border: 2px solid #00ff00; }
.score-display { font-size: 1.1em; margin: 10px 0; } .controls-section { margin: 16px 0; }
.dpad-container { position: relative; width: 150px; height: 150px; display: inline-flex; justify-content: center; margin: 12px auto; touch-action: none; }
.dpad-base { position: absolute; width: 150px; height: 150px; border-radius: 8px; background: #1a1a1a; padding: 5px; box-shadow: inset 0 0 10px #00ff00, 0 0 8px rgba(255,255,0,.3); border: 1px solid #00ff00; }
.dpad-button { position: absolute; width: 44px; height: 44px; border-radius: 6px; background: #0a0a0a; color: #00ff00; border: 2px solid #00ff00; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; touch-action: none; }
.dpad-button:active, .dpad-button.pressed { transform: translate(-1px,-1px); box-shadow: inset -1px -1px 0 #00ff00, inset 1px 1px 0 #003300; }
.up { top: 4px; left: 52px; } .down { bottom: 4px; left: 52px; } .left { top: 52px; left: 4px; } .right { top: 52px; right: 4px; }
.instructions { font-size: .95em; margin: 12px 0; }
button.restart { padding: 12px 22px; margin: 10px 5px; background: transparent; color: #00ff00; border: 2px solid #00ff00; border-radius: 8px; font-size: 1em; cursor: pointer; font-family: Tahoma, sans-serif; min-height: 48px; touch-action: manipulation; }
</style></head><body>
<h1>Snake Game</h1><canvas id="game" width="400" height="400"></canvas><div class="score-display">Score: <span id="score">0</span></div>
<div class="controls-section"><p class="instructions">Use D-pad buttons or arrow keys to move</p><div class="dpad-container"><div class="dpad-base"></div><button class="dpad-button up" data-dir="UP">↑</button><button class="dpad-button down" data-dir="DOWN">↓</button><button class="dpad-button left" data-dir="LEFT">←</button><button class="dpad-button right" data-dir="RIGHT">→</button></div><div><button class="restart" onclick="restartGame()">Restart</button></div></div>
<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d'), box = 20;
let snake = [{x: 8*box, y: 8*box}], food = randomFood(), dir = 'RIGHT', nextDir = 'RIGHT', score = 0, gameRunning = true;
function randomFood() { return {x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box}; }
function setDirection(direction) { if (dir !== getOppositeDir(direction)) nextDir = direction; }
document.querySelectorAll('.dpad-button').forEach(button => {
  button.addEventListener('pointerdown', e => { e.preventDefault(); setDirection(button.dataset.dir); button.classList.add('pressed'); button.setPointerCapture(e.pointerId); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(event => button.addEventListener(event, () => button.classList.remove('pressed')));
});
document.addEventListener('keydown', e => { const map = {ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT'}; if (map[e.key]) { setDirection(map[e.key]); e.preventDefault(); } });
function getOppositeDir(direction) { return {UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT'}[direction]; }
function updateScore() { document.getElementById('score').textContent = score; }
function draw() {
  if (!gameRunning) return; dir = nextDir; ctx.fillStyle = 'black'; ctx.fillRect(0,0,canvas.width,canvas.height);
  snake.forEach((part,i) => { ctx.fillStyle = i === 0 ? '#0f0' : '#00ff00'; ctx.fillRect(part.x,part.y,box,box); });
  ctx.fillStyle = 'red'; ctx.fillRect(food.x,food.y,box,box);
  let x=snake[0].x, y=snake[0].y; if(dir==='UP') y-=box; if(dir==='DOWN') y+=box; if(dir==='LEFT') x-=box; if(dir==='RIGHT') x+=box;
  if(x===food.x && y===food.y) { score++; updateScore(); do { food=randomFood(); } while(snake.some(part=>part.x===food.x&&part.y===food.y)); } else snake.pop();
  if(snake.some(part=>part.x===x&&part.y===y)||x<0||y<0||x>=canvas.width||y>=canvas.height) { gameRunning=false; alert('Game Over! Score: '+score); return; }
  snake.unshift({x,y});
}
function restartGame() { snake=[{x:8*box,y:8*box}]; food=randomFood(); dir=nextDir='RIGHT'; score=0; gameRunning=true; updateScore(); }
updateScore(); setInterval(draw,100);
</script></body></html>

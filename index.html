<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakub's WebSite</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Tahoma, sans-serif;
      background-color: #000000;
      color: #00ff00;
    }

    .content {
      flex: 1;
      padding: 0;
      background-color: #000000;
      overflow: visible;
      border: none;
      display: block;
      min-height: 100vh;
    }

    .xp-content {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background-color: #000;
      color: #00ff00;
      display: block;
      min-height: 100vh;
    }

    .xp-content a {
      color: #00ff00;
      text-decoration: none;
    }

    .xp-content a:hover {
      text-decoration: underline;
    }

    .top-banner {
      background-color: #00aa00;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    header {
      background: #001100;
      padding: 20px;
      text-align: center;
      font-size: 2em;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #002200;
      padding: 10px;
    }

    nav a {
      font-size: 1.1em;
      padding: 8px 12px;
    }

    section {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    h1, h2 {
      text-shadow: 0 0 5px #00ff00;
      margin-top: 0;
    }

    .glitch {
      color: #00ff00;
      position: relative;
      display: inline-block;
    }

    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0.8;
      clip: rect(0, 900px, 0, 0);
    }

    .glitch::before {
      animation: glitchTop 2s infinite linear alternate-reverse;
      color: #00ff99;
    }

    .glitch::after {
      animation: glitchBottom 2s infinite linear alternate-reverse;
      color: #009900;
    }

    @keyframes glitchTop, glitchBottom {
      /* Your existing keyframes */
    }

    .intro-container {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      flex-direction: column;
    }

    .intro-text {
      flex: 1 1 100%;
      width: 100%;
    }

    .intro-gif {
      display: flex;
      gap: 12px;
      align-items: center;
      flex: 1 1 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .intro-gif img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .intro-gif img.profile {
      max-width: 180px;
      border-radius: 6px;
    }

    .intro-gif img.animation {
      max-width: 180px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #001100;
      font-size: 0.9em;
    }

    /* Tablet and up */
    @media (min-width: 768px) {
      nav {
        gap: 30px;
        padding: 10px 0;
      }

      nav a {
        padding: 0;
        font-size: 1.1em;
      }

      section {
        padding: 40px;
      }

      .intro-container {
        flex-direction: row;
      }

      .intro-text {
        flex: 1 1 300px;
      }

      .intro-gif {
        flex: 0 0 auto;
      }

      .intro-gif img.profile {
        max-width: 220px;
      }

      .intro-gif img.animation {
        max-width: 260px;
      }

      header {
        font-size: 2em;
      }
    }

    /* Large screens */
    @media (min-width: 1024px) {
      header {
        font-size: 2.5em;
      }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="xp-content">
      <div class="top-banner">⚡ Welcome to my website!! ⚡</div>
      <header><span class="glitch" data-text="MY SITE!">MY SITE!</span></header>
      <nav>
        <a href="index.html">Home</a>
        <a href="page1.html">Blog</a>
        <a href="page2.html">Downloads</a>
        <a href="page3.html">Games/Tools</a>
      </nav>
      <section>
        <div class="intro-container">
          <div class="intro-text">
            <h1>Hello!</h1>
            <p>Hey! I'm Jakub, also known as LLegoguy. I made this site for fun. I like Lego, computing, programming, gaming, mario, minecraft, video games in general and old tech! Check out all [...]
            </p>
          </div>
          <div class="intro-gif">
            <img src="bricksanim.gif" alt="lego brick animation" class="animation">
            <img src="llegoguy.png" alt="llegoguy profile" class="profile">
          </div>
        </div>
      </section>
      <footer>&copy; Jakub 2026</footer>
    </div>
  </div>
</body>
</html>

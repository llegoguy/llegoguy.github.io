<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Random Number Generator</title>
<style>
* { box-sizing: border-box; } body { background: black; color: #00ff00; font-family: system-ui, sans-serif; text-align: center; padding: clamp(16px, 6vw, 50px); margin: 0; min-height: 100vh; }
h1 { font-size: clamp(1.7rem, 7vw, 2.5rem); overflow-wrap: anywhere; }
input, button { width: min(100%, 220px); font-size: 18px; padding: 12px; margin: 6px; background: transparent; border: 2px solid #00ff00; color: #00ff00; border-radius: 6px; }
button { width: auto; min-height: 48px; padding-inline: 20px; touch-action: manipulation; }
button:hover { filter: brightness(1.2); cursor: pointer; }
</style></head><body>
<h1>Random Number Generator</h1><p>Enter min and max numbers:</p><input type="number" id="min" placeholder="Min"><input type="number" id="max" placeholder="Max"><button id="genBtn">Generate</button><h2 id="result"></h2>
<script>document.getElementById('genBtn').addEventListener('click', () => { const min = parseInt(document.getElementById('min').value); const max = parseInt(document.getElementById('max').value); if (isNaN(min) || isNaN(max) || min > max) { alert('Enter valid numbers!'); return; } document.getElementById('result').textContent = 'Random: ' + (Math.floor(Math.random() * (max - min + 1)) + min); });</script>
</body></html>

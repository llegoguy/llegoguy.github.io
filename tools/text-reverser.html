<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Text Reverser</title>
<style>
* { box-sizing: border-box; } body { background: black; color: #00ff00; font-family: system-ui, sans-serif; text-align: center; padding: clamp(16px, 6vw, 50px); margin: 0; min-height: 100vh; }
h1 { font-size: clamp(1.7rem, 7vw, 2.5rem); overflow-wrap: anywhere; }
input, button { width: min(100%, 420px); font-size: 18px; padding: 12px; margin: 6px; background: transparent; border: 2px solid #00ff00; color: #00ff00; border-radius: 6px; }
button { width: auto; min-height: 48px; padding-inline: 20px; touch-action: manipulation; }
button:hover { filter: brightness(1.2); cursor: pointer; }
#output { overflow-wrap: anywhere; }
</style></head><body>
<h1>Text Reverser</h1><input type="text" id="text" placeholder="Type something"><button id="revBtn">Reverse</button><h2 id="output"></h2>
<script>document.getElementById('revBtn').addEventListener('click', () => { const input = document.getElementById('text').value; document.getElementById('output').textContent = input.split('').reverse().join(''); });</script>
</body></html>

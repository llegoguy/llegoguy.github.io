<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Calculator</title>
<style>
* { box-sizing: border-box; } body { background: black; color: #00ff00; font-family: system-ui, sans-serif; text-align: center; padding: clamp(12px, 4vw, 50px); margin: 0; min-height: 100vh; }
h1 { font-size: clamp(1.7rem, 7vw, 2.5rem); }
.calculator-container { display: inline-block; width: min(100%, 360px); border: 2px solid #00ff00; padding: clamp(10px, 4vw, 20px); background: #001100; border-radius: 8px; box-shadow: 0 0 10px rgba(0,255,0,.3); }
#display { width: 100%; min-width: 0; font-size: clamp(20px, 6vw, 24px); padding: 12px; background: transparent; border: 2px solid #00ff00; color: #00ff00; margin-bottom: 15px; text-align: right; border-radius: 4px; font-family: 'Courier New', monospace; }
.button-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
button { min-width: 0; min-height: 48px; font-size: clamp(16px, 5vw, 18px); padding: 10px 4px; background: transparent; border: 2px solid #00ff00; color: #00ff00; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; touch-action: manipulation; }
button:hover { filter: brightness(1.3); box-shadow: 0 0 8px rgba(0,255,0,.5); } button:active { filter: brightness(.8); }
.equals { grid-column: span 2; background: #002200; } .equals:hover { background: #003300; }
.clear { grid-column: span 2; background: #220000; border-color: red; color: red; } .clear:hover { background: #330000; box-shadow: 0 0 8px rgba(255,0,0,.5); }
</style></head><body>
<h1>Calculator</h1><div class="calculator-container"><input type="text" id="display" placeholder="0" readonly><div class="button-grid">
<button onclick="clearDisplay()" class="clear">C</button><button onclick="backspace()">←</button><button onclick="appendOperator('/')">/</button><button onclick="appendOperator('*')">×</button>
<button onclick="appendNumber('7')">7</button><button onclick="appendNumber('8')">8</button><button onclick="appendNumber('9')">9</button><button onclick="appendOperator('-')">−</button>
<button onclick="appendNumber('4')">4</button><button onclick="appendNumber('5')">5</button><button onclick="appendNumber('6')">6</button><button onclick="appendOperator('+')">+</button>
<button onclick="appendNumber('1')">1</button><button onclick="appendNumber('2')">2</button><button onclick="appendNumber('3')">3</button><button onclick="toggleSign()">±</button>
<button onclick="appendNumber('0')" style="grid-column:span 2">0</button><button onclick="appendNumber('.')">.</button><button onclick="calculate()" class="equals">=</button>
</div></div>
<script>
let display = document.getElementById('display'), currentValue = '0', previousValue = '', operator = '', shouldResetDisplay = false;
function updateDisplay() { display.value = currentValue; }
function appendNumber(num) { if (shouldResetDisplay) { currentValue = num; shouldResetDisplay = false; } else if (currentValue === '0' && num !== '.') currentValue = num; else if (num === '.' && currentValue.includes('.')) return; else currentValue += num; updateDisplay(); }
function appendOperator(op) { if (operator && !shouldResetDisplay) calculate(); previousValue = currentValue; operator = op; shouldResetDisplay = true; }
function calculate() { if (!operator || !previousValue) return; const prev = parseFloat(previousValue), current = parseFloat(currentValue); let result; switch (operator) { case '+': result = prev + current; break; case '-': result = prev - current; break; case '*': result = prev * current; break; case '/': result = prev / current; break; default: return; } currentValue = result.toString(); operator = ''; previousValue = ''; shouldResetDisplay = true; updateDisplay(); }
function clearDisplay() { currentValue = '0'; previousValue = ''; operator = ''; shouldResetDisplay = false; updateDisplay(); }
function backspace() { currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0'; updateDisplay(); }
function toggleSign() { currentValue = (parseFloat(currentValue) * -1).toString(); updateDisplay(); }
updateDisplay();
</script></body></html>
